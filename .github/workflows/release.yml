name: Release

# Push a version tag (e.g. v1.0.0) to publish a GitHub Release with the
# ready-to-load extension zips attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Build packages
        run: |
          npm run zip
          npm run zip:firefox

      - name: Name the downloads
        run: |
          V="${GITHUB_REF_NAME}"
          cp .output/flexify-*-chrome.zip "flexify-${V}.zip"
          cp .output/flexify-*-firefox.zip "flexify-${V}-firefox.zip"
          ls -la flexify-*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "flexify-${GITHUB_REF_NAME}.zip" "flexify-${GITHUB_REF_NAME}-firefox.zip" \
            --title "Flexify ${GITHUB_REF_NAME}" \
            --notes "Download **flexify-${GITHUB_REF_NAME}.zip**, extract it, then in chrome://extensions turn on Developer mode, click **Load unpacked** and select the extracted folder (the one that contains manifest.json). Do not use the green Code → Download ZIP button: that is the source code, not the extension."
